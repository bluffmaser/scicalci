<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siccalci.sit</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        background: url('14.jpg') no-repeat center center fixed;
        background-size: cover;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
      }
      
      /* Calculator container */
      .calculator {
        background: rgb(70, 70, 113);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(9, 144, 144, 0.1);
        text-align: center;
        width: 90%;
        max-width: 400px;
      }
      
      /* Headings */
      h1 {
        font-size: 1.5em;
        margin-bottom: 15px;
        color: #fff;
      }
      
      /* Inputs and buttons */
      select, input, button {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        font-size: 16px;
        border-radius: 5px;
        border: 1px solid #ccc;
      }
      
      /* Button styling */
      button {
        background: #1545b4;
        color: #fff;
        border: none;
        cursor: pointer;
        transition: 0.3s;
      }
      
      button:hover {
        background: #0b8ca9;
      }
      
      /* Result container */
      #result-container {
        margin-top: 15px;
        font-size: 18px;
        color: #0cc2c8;
      }
      
      /* Mobile-first approach with responsive adjustments */
      @media (max-width: 600px) {
        body {
          height: auto;
          padding: 20px;
        }
      
        .calculator {
          width: 95%;
          padding: 15px;
        }
      
        h1 {
          font-size: 1.2em;
        }
      
        select, input, button {
          font-size: 14px;
          padding: 10px;
        }
      
        #result-container {
          font-size: 16px;
        }
      }
      
      /* Larger screens (laptops, desktops) */
      @media (min-width: 1024px) {
        .calculator {
          width: 400px;
        }
      
        h1 {
          font-size: 1.8em;
        }
      
        select, input, button {
          font-size: 18px;
          padding: 12px;
        }
      }
    </style>      
</head>
<body>

  <div class="calculator">
    <h1>Scientific Calculator</h1>
    <div id="operation-container">
      <select id="operation-select">
        <option value="addition">Addition</option>
        <option value="subtraction">Subtraction</option>
        <option value="multiplication">Multiplication</option>
        <option value="division">Division</option>
        <option value="square">Square</option>
        <option value="squareRoot">Square Root</option>
        <option value="matrixAddition">Matrix Addition</option>
        <option value="matrixSubtraction">Matrix Subtraction</option>
        <option value="matrixMultiplication">Matrix Multiplication</option>
        <option value="logarithm">Logarithm</option>
        <option value="trigonometric">Trigonometric Functions</option>
        <option value="area">Area Calculation</option>
        <option value="factorial">Factorial</option>
        <option value="power">Power</option>
      </select>
      <button id="operation-select-btn">Select</button>
    </div>
    <div id="input-container"></div>
    <button id="calculate-btn" style="display: none;">Calculate</button>
    <div id="result-container"></div>
  </div>

<script>
  document.getElementById('operation-select-btn').addEventListener('click', () => {
    const operation = document.getElementById('operation-select').value;
    const inputContainer = document.getElementById('input-container');
    const calculateBtn = document.getElementById('calculate-btn');
    const resultContainer = document.getElementById('result-container');

    inputContainer.innerHTML = ''; 
    resultContainer.innerHTML = ''; 

    if (['addition', 'subtraction', 'multiplication', 'division', 'power'].includes(operation)) {
      inputContainer.innerHTML = `
        <input type="number" id="num1" placeholder="Enter first number">
        <input type="number" id="num2" placeholder="Enter second number">
      `;
    } else if (['square', 'squareRoot', 'factorial'].includes(operation)) {
      inputContainer.innerHTML = `<input type="number" id="num1" placeholder="Enter number">`;
    } else if (operation === 'logarithm') {
      inputContainer.innerHTML = `
        <input type="number" id="base" placeholder="Enter base">
        <input type="number" id="value" placeholder="Enter value">
      `;
    } else if (operation === 'trigonometric') {
      inputContainer.innerHTML = `<input type="number" id="angle" placeholder="Enter angle in degrees">`;
    }

    calculateBtn.style.display = 'block';
    calculateBtn.onclick = () => calculateResult(operation);
  });

  function calculateResult(operation) {
    const num1 = parseFloat(document.getElementById('num1')?.value);
    const num2 = parseFloat(document.getElementById('num2')?.value);
    const base = parseFloat(document.getElementById('base')?.value);
    const value = parseFloat(document.getElementById('value')?.value);
    const angle = parseFloat(document.getElementById('angle')?.value);
    const resultContainer = document.getElementById('result-container');
    let result;

    switch (operation) {
      case 'addition':
        result = num1 + num2;
        break;
      case 'subtraction':
        result = num1 - num2;
        break;
      case 'multiplication':
        result = num1 * num2;
        break;
      case 'division':
        result = num2 !== 0 ? num1 / num2 : 'Cannot divide by zero';
        break;
      case 'power':
        result = Math.pow(num1, num2);
        break;
      case 'square':
        result = num1 * num1;
        break;
      case 'squareRoot':
        result = num1 >= 0 ? Math.sqrt(num1) : 'Invalid number';
        break;
      case 'logarithm':
        result = base > 0 && base !== 1 && value > 0 ? Math.log(value) / Math.log(base) : 'Invalid input';
        break;
      case 'trigonometric':
        const radians = (Math.PI / 180) * angle;
        result = `
          sin(${angle}) = ${Math.sin(radians).toFixed(4)}<br>
          cos(${angle}) = ${Math.cos(radians).toFixed(4)}<br>
          tan(${angle}) = ${Math.tan(radians).toFixed(4)}
        `;
        break;
      case 'factorial':
        result = factorial(num1);
        break;
      default:
        result = 'Invalid operation';
    }

    resultContainer.innerHTML = `<b>Result:</b> ${result}`;
  }

  function factorial(n) {
    if (n < 0) return 'Factorial not defined for negative numbers';
    if (n === 0 || n === 1) return 1;
    let fact = 1;
    for (let i = 2; i <= n; i++) {
      fact *= i;
    }
    return fact;
  }
</script>

</body>
</html>
